
name: Update GitHub Telemetry

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate telemetry dashboard
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python generate_telemetry.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: abdulrahmanrifayath
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
